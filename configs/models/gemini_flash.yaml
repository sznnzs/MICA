model:
  model_id: gemini-2.5-flash
  model: ${GEMINI_MODEL:-gemini-2.5-flash}
  provider: openai_compatible
  role: policy
  auth: required
  api_key_env: API_KEY
  base_url_env: API_BASE_URL
  proxy_mode: direct
  send_seed: false
  timeout_seconds: 180
  max_retries: 0
  retry_backoff_seconds: 0
  extra_body: {}
  input_token_counting:
    mode: conservative_utf8_bytes_per_3
