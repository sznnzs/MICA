[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mica-interface-study"
version = "1.0.0"
description = "Matched interface comparison and commitment-preserving action realization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyYAML>=6.0,<7",
  "openai>=1.0,<3",
  "httpx>=0.27,<1",
  "transformers>=4.51,<5",
  "Jinja2>=3.1,<4",
  "numpy>=1.24,<2",
]

[project.urls]
Repository = "https://github.com/sznnzs/MICA"
Issues = "https://github.com/sznnzs/MICA/issues"

[project.optional-dependencies]
alfworld = ["alfworld==0.4.2"]
scienceworld = ["scienceworld==1.2.3"]
webshop = [
  "beautifulsoup4>=4.11,<5",
  "cleantext==1.1.4",
  "Flask==2.1.2",
  "Werkzeug==2.1.0",
  "gym==0.24.0",
  "rank-bm25==0.2.2",
  "rich>=12,<15",
  "selenium>=4.2,<5",
  "thefuzz==0.19.0",
  "torch>=2.0",
  "tqdm>=4.64",
  "requests>=2.27,<3",
  "gdown>=5,<6",
]

[project.scripts]
mica = "mcp_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_cli = ["resources/prompts/**/*.txt"]

[tool.setuptools.data-files]
"share/mica/configs" = ["configs/*.yaml", "configs/*.json"]
"share/mica/configs/benchmarks" = ["configs/benchmarks/*.yaml"]
"share/mica/configs/environments" = ["configs/environments/*.yaml"]
"share/mica/configs/methods" = ["configs/methods/*.yaml"]
"share/mica/configs/models" = ["configs/models/*.yaml"]
"share/mica/configs/tasks" = ["configs/tasks/*.json"]
